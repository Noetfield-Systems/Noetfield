name: Noetfield Connect Intake Smoke

on:
  pull_request:
    paths:
      - 'connect/**'
      - 'opportunities/**'
      - 'contact/**'
      - 'index.html'
      - 'terms/**'
      - 'privacy/**'
      - 'trust/**'
      - 'proof/**'
      - 'work-with-us/**'
      - 'assets/noetfield-collaboration-entry.js'
      - 'scripts/test-corporate-trust-polish.cjs'
      - 'governance/www-public-artifact-v1.json'
      - 'scripts/test-connect-static.cjs'
      - 'scripts/test-connect-v3.cjs'
      - 'assets/noetfield-connect-v3.*'
      - 'api/connect/participant/**'
      - '.github/workflows/nf-connect-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'connect/**'
      - 'opportunities/**'
      - 'contact/**'
      - 'governance/www-public-artifact-v1.json'
      - 'scripts/test-connect-static.cjs'
      - '.github/workflows/nf-connect-smoke.yml'

permissions:
  contents: read

jobs:
  static-connect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Noetfield Connect route and submission wiring
        run: |
          node --check assets/noetfield-connect-v3.js
          node scripts/test-connect-static.cjs
          node scripts/test-connect-v3.cjs
          node scripts/test-corporate-trust-polish.cjs
