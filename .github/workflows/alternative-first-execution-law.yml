name: Alternative-First Execution Law
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  enforce-alternative-first:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate mandatory Founder recovery law and repo boundaries
        run: python3 scripts/check_repo_policy.py
