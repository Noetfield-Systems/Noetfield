name: Noetfield Command Center Visual QA
on:
  push:
    branches: [fix/noetfield-image-fidelity-v2]
  pull_request:
    paths:
      - "index.html"
      - "assets/noetfield-command*"
      - "scripts/verify-noetfield-command-center-visual.py"
      - ".github/workflows/noetfield-command-visual-qa.yml"
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install headless Chromium
        run: |
          python -m pip install playwright==1.65.1
          python -m playwright install --with-deps chromium
      - name: Visual and interaction acceptance at four viewports
        run: python scripts/verify-noetfield-command-center-visual.py
      - name: Publish screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noetfield-command-center-preview
          path: tmp/noetfield-command-visual/
          retention-days: 7
