name: Onchain V7 Cinematic Visual QA

on:
  pull_request:
    paths:
      - "onchain/**"
      - "scripts/verify-onchain-v7-visual.py"
      - ".github/workflows/onchain-v7-cinematic-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-render-and-interactions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install real Chromium for responsive visual checks
        run: |
          python -m pip install --disable-pip-version-check "playwright==1.65.1" "pillow>=11,<13"
          python -m playwright install --with-deps chromium
      - name: Start preview server for checked out source
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/onchain-v7-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/onchain/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:8765/onchain/hero-architecture-v7.webp
          curl -fsS -o /dev/null http://127.0.0.1:8765/onchain/onchain-v7.css
          curl -fsS -o /dev/null http://127.0.0.1:8765/onchain/onchain-v7.js
      - name: Evaluate real visual render and E2E first-fold interactions at 4 viewports
        env:
          ONCHAIN_URL: http://127.0.0.1:8765/onchain/
          ONCHAIN_EMIT_PREVIEW: "1"
        run: python scripts/verify-onchain-v7-visual.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onchain-v7-visual-screenshots
          path: tmp/onchain-v7-visual-qa/
          retention-days: 14
          if-no-files-found: warn
