permissions:
  contents: read

jobs:
  desk-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: connect
          POSTGRES_PASSWORD: connect_test
          POSTGRES_DB: connect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 10
    env:
      CONNECT_TEST_POSTGRES_URL: postgresql://connect:connect_test@localhost:5432/connect_test
      RUNTIME_EVENT_STORE: memory
      PYTHONPATH: .:packages/types:packages/config:services/events:services/ledger:services/graph:services/governance:services/signals:services/workflow:services/ai-runtime:services/inspectors:services/identity:services/copilot-governance:services/factories:services/trust-brief:services/legal-review:services/aml-trace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify cross-service canonical Connect source projector
        run: python -m pytest -q tests/unit/test_workforce_connect_bridge.py
      - name: Verify persistent bridge reconciliation and exponential retry
        run: python -m pytest -q tests/unit/test_connect_bridge_reconciler.py
      - name: Verify Company OS read-only source-key bridge
        run: python -m pytest -q tests/unit/test_company_os_connect_readback.py
      - name: Compile changed Python modules
        run: python -m compileall -q services/governance/noetfield_governance
      - name: Run concrete Connect operator API regression suite
        run: python -m pytest -q tests/unit/test_connect_opportunity_desk.py tests/unit/test_connect_relationship.py
      - name: Real PostgreSQL persistence and tenant-bound operator state
        run: python -m pytest -q tests/unit/test_connect_postgres_acceptance.py
      - name: Verify browser sessions and scoped CSRF access
        run: python -m pytest -q tests/unit/test_connect_desk_session.py
      - name: Verify Google operator SSO, allowlist and private CRM session
        run: python -m pytest -q tests/unit/test_operator_google_sso.py tests/unit/test_corporate_crm.py
      - name: Verify historical corporate recovery, revenue truth and agent-ready priorities
        run: python -m pytest -q tests/unit/test_corporate_revenue_ops.py
      - name: Verify autonomous corporate daily cycle and operator-only receipt
        run: python -m pytest -q tests/unit/test_corporate_revenue_loop.py
      - name: Verify customer portal membership and independently verified cash
        run: python -m pytest -q tests/unit/test_customer_portal.py
      - name: Verify Fieldwork CORPORATE source isolation and real provider-backed outreach
        run: python -m pytest -q tests/unit/test_corporate_fieldwork_outbound.py
      - name: Verify real PostgreSQL source qualification and idempotent CRM persistence
        run: python -m pytest -q tests/unit/test_corporate_qualification_db.py
      - name: Verify CASL mailing identity, public-business relevance, provider opt-outs and suppression
        run: python -m pytest -q tests/unit/test_corporate_outbound_optout.py
      - name: Verify paid scope to real WorkPacket and independent customer receipt contract
        run: python -m pytest -q tests/unit/test_corporate_workpacket.py
      - name: Verify Founder source research, bounded network safety and real private endpoints
        run: python -m pytest -q tests/unit/test_corporate_founder_scout.py
      - name: Verify source-to-revenue growth funnel and private access
        run: python -m pytest -q tests/unit/test_corporate_growth_funnel.py
      - name: Syntax check private Corporate CRM interactive scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile
          html=Path('services/governance/noetfield_governance/private_corporate_crm.html').read_text()
          blocks=re.findall(r'<script[^>]*>([\s\S]*?)</script>',html)
          assert blocks, 'CRM scripts are missing'
          with tempfile.NamedTemporaryFile(mode='w',suffix='.js') as f:
              f.write('\n'.join(blocks))
              f.flush()
              subprocess.run(['node','--check',f.name],check=True)
          PY
      - name: Verify native paid RWA Clinic case execution without synthetic evidence
        run: python -m pytest -q tests/unit/test_corporate_rwa_execution.py
      - name: Verify private fictional Company OS and RWA case lab without live side effects
        run: python -m pytest -q tests/unit/test_commercial_scenario_lab.py
      - name: Regression legacy intake delivery and closure require genuine verifier and buyer
        run: python -m pytest -q tests/unit/test_commercial_delivery_single_truth.py
      - name: Check static operator shell for unsafe storage
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('assets/opportunity-desk.html').read_text()
          assert 'localStorage' not in s
          assert 'sessionStorage' not in s
          assert 'X-Desk-CSRF' in s
          assert 'X-Admin-Secret' not in s
          assert 'setInterval' not in s
          assert 'relationship-graph' in s
          assert 'invitation-form' in s
          assert 'localStorage' not in Path('connect/respond/index.html').read_text()
          PY

      - name: Check public Connect entry, invitation page and Cloudflare proxy syntax
        run: |
          node scripts/test-connect-static.cjs
          node --check api/connect/respond.js
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile
          content=Path('connect/respond/index.html').read_text()
          assert 'referrer" content="no-referrer"' in content
          script=re.findall(r'<script>([\s\S]*?)</script>',content)
          assert len(script)==1
          with tempfile.NamedTemporaryFile(mode='w',suffix='.js') as out:
              out.write(script[0]);out.flush()
              subprocess.run(['node','--check',out.name],check=True)
          PY
