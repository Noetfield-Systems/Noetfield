name: Noetfield Connect Opportunity Desk Acceptance

on:
  pull_request:
    paths:
      - 'services/governance/noetfield_governance/opportunity_desk.py'
      - 'services/governance/noetfield_governance/intake_repository.py'
      - 'services/governance/noetfield_governance/postgres_intake_store.py'
      - 'services/governance/noetfield_governance/api.py'
      - 'assets/opportunity-desk.html'
      - 'tests/unit/test_connect_opportunity_desk.py'
      - 'tests/unit/test_connect_postgres_acceptance.py'
      - 'tests/unit/test_connect_desk_session.py'
      - 'services/governance/noetfield_governance/connect_desk_auth.py'
      - 'tests/unit/test_connect_relationship.py'
      - 'services/governance/noetfield_governance/connect_relationship.py'
      - 'connect/index.html'
      - 'connect/respond/index.html'
      - 'api/connect/respond.js'
      - '.github/workflows/connect-desk-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'services/governance/noetfield_governance/opportunity_desk.py'
      - 'services/governance/noetfield_governance/intake_repository.py'
      - 'services/governance/noetfield_governance/postgres_intake_store.py'
      - 'services/governance/noetfield_governance/api.py'
      - 'assets/opportunity-desk.html'
      - 'tests/unit/test_connect_opportunity_desk.py'
      - 'tests/unit/test_connect_postgres_acceptance.py'
      - 'tests/unit/test_connect_desk_session.py'
      - 'services/governance/noetfield_governance/connect_desk_auth.py'
      - 'tests/unit/test_connect_relationship.py'
      - 'services/governance/noetfield_governance/connect_relationship.py'
      - 'connect/index.html'
      - 'connect/respond/index.html'
      - 'api/connect/respond.js'
      - '.github/workflows/connect-desk-acceptance.yml'

permissions:
  contents: read

jobs:
  desk-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: connect
          POSTGRES_PASSWORD: connect_test
          POSTGRES_DB: connect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 10
    env:
      CONNECT_TEST_POSTGRES_URL: postgresql://connect:connect_test@localhost:5432/connect_test
      RUNTIME_EVENT_STORE: memory
      PYTHONPATH: .:packages/types:packages/config:services/events:services/ledger:services/graph:services/governance:services/signals:services/workflow:services/ai-runtime:services/inspectors:services/identity:services/copilot-governance:services/factories:services/trust-brief:services/legal-review:services/aml-trace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile changed Python modules
        run: python -m compileall -q services/governance/noetfield_governance
      - name: Run concrete Connect operator API regression suite
        run: python -m pytest -q tests/unit/test_connect_opportunity_desk.py tests/unit/test_connect_relationship.py
      - name: Real PostgreSQL persistence and tenant-bound operator state
        run: python -m pytest -q tests/unit/test_connect_postgres_acceptance.py
      - name: Verify browser sessions and scoped CSRF access
        run: python -m pytest -q tests/unit/test_connect_desk_session.py
      - name: Check static operator shell for unsafe storage
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('assets/opportunity-desk.html').read_text()
          assert 'localStorage' not in s
          assert 'sessionStorage' not in s
          assert 'X-Desk-CSRF' in s
          assert 'X-Admin-Secret' not in s
          assert 'setInterval' not in s
          assert 'relationship-graph' in s
          assert 'invitation-form' in s
          assert 'localStorage' not in Path('connect/respond/index.html').read_text()
          PY

      - name: Check public Connect entry, invitation page and Cloudflare proxy syntax
        run: |
          node scripts/test-connect-static.cjs
          node --check api/connect/respond.js
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile
          content=Path('connect/respond/index.html').read_text()
          assert 'referrer" content="no-referrer"' in content
          script=re.findall(r'<script>([\s\S]*?)</script>',content)
          assert len(script)==1
          with tempfile.NamedTemporaryFile(mode='w',suffix='.js') as out:
              out.write(script[0]);out.flush()
              subprocess.run(['node','--check',out.name],check=True)
          PY
