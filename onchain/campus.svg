<filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#000d12" flood-opacity=".8"/></filter>
<clipPath id="horizon"><path d="M0 0H1600V900H0Z"/></clipPath>
