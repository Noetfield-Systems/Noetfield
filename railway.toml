# AEGIS ISC deployment branch override (NOT the Noetfield platform default).
# Only this deployment branch uses this root config; main retains the canonical platform config.
[build]
builder = "RAILPACK"
watchPatterns = ["apps/aegis-isc-cockpit/**", "railway.toml"]

[deploy]
startCommand = "node server.mjs"
healthcheckPath = "/api/health"
healthcheckTimeout = 240
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
