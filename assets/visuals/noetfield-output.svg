<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="t d"><title id="t">Deliverable and evidence illustration</title><desc id="d">Conceptual rendering of layered output with a traceable evidence record</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#faf8f4"/><stop offset=".52" stop-color="#e5e5e1"/><stop offset="1" stop-color="#cfd5d8"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".83"/><stop offset="1" stop-color="#b6cbd6" stop-opacity=".37"/></linearGradient>
<linearGradient id="slab" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbf8f2"/><stop offset=".6" stop-color="#ddd9d2"/><stop offset="1" stop-color="#9eaaa9"/></linearGradient>
<linearGradient id="black" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#46515a"/><stop offset="1" stop-color="#171f27"/></linearGradient>
<linearGradient id="steel" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#748fa3"/><stop offset=".5" stop-color="#adc9d5"/><stop offset="1" stop-color="#718c9d"/></linearGradient>
<radialGradient id="light"><stop stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<filter id="shadow" x="-30%" y="-70%" width="160%" height="240%"><feDropShadow dx="0" dy="24" stdDeviation="25" flood-color="#283641" flood-opacity=".16"/></filter>
<filter id="soft"><feGaussianBlur stdDeviation="32"/></filter>
<pattern id="grain" width="72" height="72" patternUnits="userSpaceOnUse"><path d="M0 71.5H72 M71.5 0V72" stroke="#8999a2" stroke-opacity=".085"/></pattern></defs>
<rect width="1600" height="1000" fill="url(#bg)"/><rect width="1600" height="1000" fill="url(#grain)"/><ellipse cx="400" cy="130" rx="880.0000000000001" ry="400" fill="url(#light)" opacity=".82"/><path d="M0 810 L1600 680" stroke="#a7abb0" stroke-opacity=".22" stroke-width="2"/><path d="M0 900 L1600 790" stroke="#fff" stroke-opacity=".45" stroke-width="2"/>
<g><ellipse cx="785" cy="756" rx="520" ry="100" fill="#253442" opacity=".13" filter="url(#soft)"/><rect x="480" y="635" width="620" height="80" rx="16" fill="url(#black)" filter="url(#shadow)"/><rect x="495" y="541" width="595" height="87" rx="14" fill="url(#slab)" filter="url(#shadow)" stroke="#fff" stroke-width="3"/><rect x="515" y="462" width="555" height="85" rx="12" fill="url(#glass)" filter="url(#shadow)" stroke="#fff" stroke-width="3"/><rect x="535" y="386" width="515" height="85" rx="12" fill="#e5dfd4" filter="url(#shadow)" stroke="#fff" stroke-width="3"/><rect x="555" y="311" width="475" height="83" rx="12" fill="url(#glass)" filter="url(#shadow)" stroke="#fff" stroke-width="3"/><path d="M1090 531H1240V332" fill="none" stroke="#6e91a7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M1090 531H1240V332" fill="none" stroke="#d8eef9" stroke-width="1.5" stroke-linecap="round"/><g filter="url(#shadow)"><rect x="1191" y="230" width="270" height="245" rx="17" fill="url(#glass)" stroke="#fff" stroke-width="2"/><rect x="1215" y="253" width="70.2" height="8" rx="4" fill="#7c9dab" opacity=".7"/><rect x="1215" y="277" width="175.5" height="10" rx="5" fill="#5c6c77" opacity=".26"/><rect x="1215" y="298" width="118.8" height="10" rx="5" fill="#5c6c77" opacity=".18"/></g><g><rect x="230" y="725" rx="16" width="170" height="38" fill="#f9faf9" fill-opacity=".84" stroke="#b0b9bd" stroke-opacity=".7"/><text x="248" y="750" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" letter-spacing="2" fill="#475761">OUTPUT</text></g><g><rect x="1185" y="730" rx="16" width="170" height="38" fill="#f9faf9" fill-opacity=".84" stroke="#b0b9bd" stroke-opacity=".7"/><text x="1203" y="755" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" letter-spacing="2" fill="#475761">EVIDENCE</text></g></g>
<g font-family="Arial,Helvetica,sans-serif" fill="#34414a"><text x="104" y="87" font-size="23" font-weight="700" letter-spacing="4">NOETFIELD / SYSTEMS</text><text x="1496" y="87" text-anchor="end" font-size="19" letter-spacing="3" fill="#6e7b81">EXECUTION VISUALIZATION</text></g>
