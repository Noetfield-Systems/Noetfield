 <linearGradient id="gold"><stop stop-color="#fce3ab"/><stop offset=".24" stop-color="#c9984f"/><stop offset=".53" stop-color="#fff1cb"/><stop offset=".8" stop-color="#a86b3c"/><stop offset="1" stop-color="#ffc975"/></linearGradient>
 <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d7c8ff"/><stop offset=".38" stop-color="#8058f5"/><stop offset=".7" stop-color="#542ba9"/><stop offset="1" stop-color="#e5d4ff"/></linearGradient>
